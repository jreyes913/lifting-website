<div id="create-athlete">
    <div id="create-athlete-title">Register Athlete</div>
    <form onsubmit="createAthlete(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />

        <label for="dob">DOB:</label>
        <input type="date" id="dob" name="dob" />

        <label for="xp">XP:</label>
        <input type="number" id="xp" name="xp" />

        <label for="height">Height:</label>
        <input type="number" id="height" name="height" />

        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <button type="submit">Submit</button>
    </form>
</div>
<div id="athletes-list">
    <h2>Athletes:</h2>
</div>
<div id="data-management">
    <div id="data-management-title">Data Management</div>
    <div id="data-management-buttons">
        <button type="button" id="export-btn" onclick="exportData()">Export Data</button>
        <label id="import-label" for="import-file">
            Import Data
            <input type="file" id="import-file" accept=".json" onchange="importData(event)" />
        </label>
    </div>
</div>
