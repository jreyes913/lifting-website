<div id="lateral-nav"></div>
<div id="apply-preset">
    <div id="apply-preset-title">Apply Preset</div>
    <form onsubmit="applyPreset(event)">
        <label for="program-select">Program:</label>
        <select id="program-select" name="program-select" onchange="loadPresetsForProgram(this.value)">
            <option value="">-- Select Program --</option>
        </select>

        <label for="preset-select">Preset:</label>
        <select id="preset-select" name="preset-select" disabled>
            <option value="">-- Select Preset --</option>
        </select>

        <button type="submit">Apply</button>
    </form>
</div>
<div id="create-block">
    <div id="create-block-title">Record Block</div>
    <form onsubmit="createBlock(event)">
        <label for="exercise">Exercise:</label>
        <select id="exercise" name="exercise"></select>

        <label for="order">Order:</label>
        <input type="number" id="order" name="order" />

        <label for="goal">Goal:</label>
        <select id="goal" name="goal"></select>

        <button type="submit">Submit</button>
    </form>
</div>
<div id="blocks-list">
    <div>Blocks:</div>
</div>
